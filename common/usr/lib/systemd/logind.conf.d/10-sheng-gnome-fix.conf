# The power key never suspends on sheng: logind must ignore it so it cannot
# start a suspend cycle that would wedge the device. The lid/hall switch is
# handled by sheng-power-key-display-toggle / fake-tablet-mode via
# org.gnome.Mutter.DisplayConfig PowerSaveMode instead.
[Login]
HandlePowerKey=ignore
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore