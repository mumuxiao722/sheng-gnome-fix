# Suspending (especially deep sleep) cannot be woken reliably on the Xiaomi
# Pad 6S Pro (sheng) - a pending wakeup during the CPU-freeze step aborts the
# suspend and leaves a black screen. Disable suspend/hibernate entirely:
# no GNOME "Suspend" button, no auto-sleep. sheng-power-key-display-toggle
# blanks/restores the display instead.
[Sleep]
AllowSuspend=no
AllowHibernation=no
AllowHybridSleep=no
AllowSuspendThenHibernate=no